# Tên ứng dụng trong cấu hình Spring Boot.
spring.application.name=salary-management

# H2 chạy trong bộ nhớ: dữ liệu chỉ tồn tại trong phiên chạy hiện tại.
spring.datasource.url=jdbc:h2:mem:salarydb
# Driver giúp Java kết nối H2; tài khoản sa có mật khẩu trống trong bản demo này.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate tạo/cập nhật cấu trúc bảng dựa vào entity khi khởi động.
spring.jpa.hibernate.ddl-auto=update
# In SQL và xuống dòng dễ đọc trong console để quan sát các thao tác database.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Bật giao diện xem database tại /h2-console khi ứng dụng đang chạy.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Tắt cache template để thuận tiện khi phát triển giao diện.
spring.thymeleaf.cache=false
# Cho phép phản hồi lỗi mặc định chứa thông tin binding và thông báo lỗi.
server.error.include-binding-errors=always
server.error.include-message=always
