<!doctype html>
<!-- xmlns:th khai báo các thuộc tính Thymeleaf được xử lý ở server trước khi gửi HTML. -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Có ID là sửa nhân viên; chưa có ID là thêm mới. -->
    <title th:text="${employee.id == null} ? 'Thêm nhân viên | Salary Management' : 'Sửa nhân viên | Salary Management'">Nhân viên</title>
    <!-- Bootstrap cung cấp kiểu dáng; app.css bổ sung CSS riêng của project. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="app-nav" aria-label="Điều hướng chính">
    <div class="app-container nav-inner">
        <a class="app-brand" th:href="@{/employees}"><span class="brand-mark"><i data-lucide="wallet" aria-hidden="true"></i></span>Salary Management</a>
        <a class="nav-current" th:href="@{/employees}"><i data-lucide="users" aria-hidden="true"></i> Nhân viên</a>
        <span class="workspace-label">Quản lý nhân sự</span>
    </div>
</nav>

<main class="app-container main-content form-page">
    <div class="page-heading">
        <div>
            <a class="back-link" th:href="@{/employees}"><i data-lucide="arrow-left" aria-hidden="true"></i> Danh sách nhân viên</a>
            <h1 th:text="${employee.id == null} ? 'Thêm nhân viên' : 'Sửa nhân viên'">Nhân viên</h1>
        </div>
        <span class="record-label" th:if="${employee.id != null}" th:text="'Mã nhân viên #' + ${employee.id}"></span>
    </div>

    <!-- Form dùng chung cho thêm và sửa. th:object chọn đối tượng Employee từ Model.
         ID null gửi POST /employees; có ID gửi POST /employees/{id} để cập nhật.
         *{tenThuocTinh} đọc thuộc tính của đối tượng đã chọn bằng th:object. -->
    <form class="employee-form" th:object="${employee}"
          th:action="${employee.id == null} ? @{/employees} : @{/employees/{id}(id=${employee.id})}"
          method="post">
        <div class="form-section-title"><i data-lucide="user-round" aria-hidden="true"></i><h2>Thông tin nhân viên</h2></div>
        <!-- Bootstrap: row chia hàng, g-3 tạo khoảng cách; col-12 chiếm cả hàng trên màn hình nhỏ,
             col-md-6 chiếm nửa hàng từ kích thước md trở lên. -->
        <div class="row g-3">
            <div class="col-12 col-md-6">
                <label class="form-label" for="fullName">Họ và tên</label>
                <!-- th:field tạo name/id/value để liên kết ô nhập với thuộc tính fullName.
                     th:classappend thêm is-invalid khi có lỗi; th:errors hiện thông báo validation.
                     Các ô bên dưới dùng cùng cách liên kết và hiển thị lỗi này. -->
                <input class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                       id="fullName" type="text" th:field="*{fullName}">
                <div class="invalid-feedback" th:errors="*{fullName}"></div>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                       id="email" type="email" th:field="*{email}">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label" for="phone">Số điện thoại</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                       id="phone" type="tel" th:field="*{phone}">
                <div class="invalid-feedback" th:errors="*{phone}"></div>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label" for="department">Phòng ban</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'"
                       id="department" type="text" th:field="*{department}">
                <div class="invalid-feedback" th:errors="*{department}"></div>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label" for="position">Chức vụ</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('position')} ? 'is-invalid'"
                       id="position" type="text" th:field="*{position}">
                <div class="invalid-feedback" th:errors="*{position}"></div>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label" for="salary">Lương <span class="label-unit">VND</span></label>
                <!-- min và step giới hạn nhập ở trình duyệt; server vẫn kiểm tra bằng annotation Java. -->
                <input class="form-control" th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid'"
                       id="salary" type="number" min="0.01" step="0.01" th:field="*{salary}">
                <div class="invalid-feedback" th:errors="*{salary}"></div>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label" for="dateOfBirth">Ngày sinh</label>
                <!-- type=date cho phép chọn ngày và gửi giá trị theo dạng yyyy-MM-dd. -->
                <input class="form-control" th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid'"
                       id="dateOfBirth" type="date" th:field="*{dateOfBirth}">
                <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label" for="hireDate">Ngày vào làm</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('hireDate')} ? 'is-invalid'"
                       id="hireDate" type="date" th:field="*{hireDate}">
                <div class="invalid-feedback" th:errors="*{hireDate}"></div>
            </div>
        </div>

        <!-- Save gửi form bằng POST; Cancel là liên kết về danh sách và không lưu dữ liệu. -->
        <div class="form-actions">
            <a class="btn btn-light" th:href="@{/employees}">Hủy</a>
            <button type="submit" class="btn btn-primary"><i data-lucide="check" aria-hidden="true"></i> Lưu nhân viên</button>
        </div>
    </form>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script>
    // Dùng Lucide để tạo biểu tượng đồng nhất với trang danh sách.
    if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
